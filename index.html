<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每週規劃">
<link rel="manifest" href="manifest.webmanifest">
<title>每週規劃</title>
<style>
:root{--bg:#000;--panel:#141414;--panel2:#1b1b1b;--text:#f5f5f7;--muted:#8e8e93;--line:#2c2c2e;--danger:#8e3b3b;--text-scale:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background-color:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom));overflow-x:hidden}
header{background:#050505;border-bottom:0;padding:calc(16px + env(safe-area-inset-top)) 18px 15px;position:sticky;top:0;z-index:10;text-align:center}.header-inner{position:relative;min-height:32px;display:flex;align-items:center;justify-content:center}.day-holder{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:850;letter-spacing:.05em;color:#f5f5f7;text-shadow:none}
.title-mark{display:inline-flex;cursor:pointer;align-items:center;justify-content:center;width:42px;height:42px;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;padding:0;overflow:visible;-webkit-user-select:none;user-select:none}.title-mark img{display:block;width:42px;height:42px;object-fit:contain;border:0;outline:0;box-shadow:none;mix-blend-mode:screen;pointer-events:none}
main{width:100%;max-width:1100px;margin:auto;padding:16px 14px 90px;text-align:center}
.orientation-note{font-size:12px;color:var(--muted);margin:0 0 13px;opacity:1;max-height:40px;transition:opacity .5s ease,max-height .5s ease,margin .5s ease}.orientation-note.hide{opacity:0;max-height:0;margin:0;overflow:hidden}
.section-title{font-size:calc(22px * var(--text-scale));font-weight:850;letter-spacing:.12em;margin:0 0 12px;color:#f5f5f7}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#schedulePanel,#taskPanel{position:relative;background:transparent;border:0;border-radius:0;box-shadow:none;padding:14px 0 16px;margin:0 0 18px}
#schedulePanel::before,#schedulePanel::after,#taskPanel::before{content:"";position:relative;display:block;width:100vw;height:1px;background:rgba(255,255,255,.08);box-shadow:none;margin-left:calc(50% - 50vw)}
#schedulePanel::before,#taskPanel::before{margin-bottom:14px}
#schedulePanel::after{display:none}

.row{display:flex;align-items:center;justify-content:flex-start;gap:9px;width:100%;min-height:58px;margin:0;padding:9px 12px;background:linear-gradient(180deg,#171717,#101010);border:0;border-radius:0;box-shadow:none;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.timebox{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto}
.time-side{display:inline-flex;align-items:center;justify-content:center;min-width:76px;padding:8px 5px;background:transparent;border:0;color:var(--text);font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:calc(16px * var(--text-scale));line-height:1;white-space:nowrap}
.time-side:active{background:#1b1b1b}

.row>input[type=text],.row>textarea{flex:1 1 auto;width:auto;min-width:80px;max-width:min(58vw,520px);min-height:42px;max-height:96px;text-align:left;padding:8px 4px;border:0;border-radius:0;background:transparent;color:var(--text);font-weight:650;font-size:calc(16px * var(--text-scale));line-height:1.45;outline:none;box-shadow:none;resize:none;overflow-y:auto;user-select:text;-webkit-user-select:text;transition:width .08s ease}
.row>input[type=text]:focus,.row>textarea:focus{border:0;box-shadow:none;background:transparent}
input,textarea,select{font:inherit}
input::placeholder{color:#6f6a61}
.add-btn{margin:17px auto 0;background:transparent;color:#f5f5f7;border:1px solid #3a3a3c;border-radius:0;min-height:42px;padding:8px 18px;font-weight:750;box-shadow:none}
.add-btn:active{background:rgba(202,168,74,.08)}
.empty{color:var(--muted);font-size:14px;padding:10px 0 14px}
.task-list{display:flex;flex-direction:column;align-items:center;gap:0}.task-stats{margin:0 0 6px;text-align:center;color:#f5f5f7;font-size:calc(13px * var(--text-scale));font-weight:700;letter-spacing:.06em}
.task{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;margin:0;padding:9px 12px;background:linear-gradient(180deg,#171717,#101010);border:0;border-radius:0;box-shadow:none;user-select:none;-webkit-user-select:none;touch-action:pan-y;position:relative}
.task input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:#f5f5f7;position:absolute;right:12px;user-select:none;-webkit-user-select:none}
.task-time{display:none}.task span:not(.task-time){display:block;flex:0 1 82%;min-width:0;max-width:82%;word-break:break-word;font-weight:650;font-size:calc(16px * var(--text-scale));text-align:center;user-select:none;-webkit-user-select:none}.done{text-decoration:line-through;color:#666}.active-row{animation:softBreath 2.8s ease-in-out infinite;box-shadow:0 0 18px rgba(255,255,255,.10),inset 0 0 18px rgba(255,255,255,.035);background:#1a1a1a}.other-day .row{opacity:.52}.other-day .task,.other-day .task-add-row,.other-day .task-stats{opacity:.65}.past-row{opacity:.48}.past-row textarea,.past-row .time-side{text-decoration:line-through;color:#777}.past-row{background:#0e0e0e}@keyframes softBreath{0%,100%{box-shadow:0 0 10px rgba(255,255,255,.06),inset 0 0 10px rgba(255,255,255,.02)}50%{box-shadow:0 0 22px rgba(255,255,255,.14),inset 0 0 20px rgba(255,255,255,.04)}}@media(prefers-reduced-motion:reduce){.active-row{animation:none}}
.task-add-row{width:100%;display:flex;align-items:center;justify-content:center;min-height:58px;margin:0 auto 7px;padding:9px 12px;background:linear-gradient(180deg,#171717,#101010);border:0;border-radius:0;box-shadow:none}.task-add-time{display:none}.task-add-text{width:82%;min-width:0;text-align:center;padding:10px 8px;border:0;background:transparent;color:var(--text);outline:none;font-weight:650;font-size:calc(15px * var(--text-scale));user-select:none;-webkit-user-select:none}.task-add-text:focus{box-shadow:none;background:transparent}

/* iPhone-like controls */
.header-action{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#f5f5f7;font-size:22px;line-height:1;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .16s ease,background .16s ease,opacity .16s ease}.header-action:active{transform:translateY(-50%) scale(.9);background:#1c1c1e}.header-action .dots{font-weight:800;letter-spacing:1px}.settings{position:absolute;right:10px;top:calc(58px + env(safe-area-inset-top));bottom:auto;z-index:50;pointer-events:none}.settings.open{pointer-events:auto}.settings-menu{width:min(300px,calc(100vw - 28px));background:rgba(28,28,30,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:8px;box-shadow:0 18px 45px rgba(0,0,0,.55);display:block;opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;visibility:hidden;transition:opacity .18s ease,transform .18s ease,visibility .18s ease;text-align:left}.settings.open .settings-menu{opacity:1;transform:translateY(0) scale(1);visibility:visible}.settings-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin:2px 0;text-align:left;background:transparent;border:0;border-radius:13px;color:#f5f5f7;font-weight:600;padding:10px 13px}.settings-menu button:active{background:#3a3a3c}.settings-menu .danger-action{color:#ff6961}.settings-menu .notice{padding:8px 13px;color:#8e8e93}.settings-section{padding:8px 13px 10px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px}.settings-section:last-child{border-bottom:0}.settings-label{display:flex;justify-content:space-between;align-items:center;color:#f5f5f7;font-size:15px;font-weight:650;margin-bottom:8px}.size-control{width:100%;accent-color:#f5f5f7}.size-value{color:#8e8e93;font-size:13px}.search-bar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;width:min(620px,calc(100vw - 28px));height:46px;border-radius:15px;background:rgba(44,44,46,.96);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 14px;box-shadow:0 10px 28px rgba(0,0,0,.45)}.search-bar span{color:#8e8e93;font-size:17px;margin-right:8px}.search-bar input{flex:1;border:0;outline:0;background:transparent;color:#f5f5f7;font-size:16px}.search-bar input::placeholder{color:#8e8e93}.search-clear{border:0;background:transparent;color:#8e8e93;font-size:18px;padding:4px 6px;display:none}.search-active .search-clear{display:block}.action-sheet-backdrop{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}.action-sheet-backdrop.open{display:flex}.action-sheet{width:min(520px,calc(100vw - 20px));margin:0 10px calc(10px + env(safe-area-inset-bottom));background:rgba(28,28,30,.98);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6);transform:translateY(20px);opacity:0;animation:sheetIn .18s ease forwards}.action-sheet button{width:100%;min-height:52px;border:0;border-bottom:1px solid rgba(255,255,255,.08);background:transparent;color:#f5f5f7;font-size:16px}.action-sheet button:last-child{border-bottom:0;color:#8e8e93}.action-sheet button.delete{color:#ff6961}@keyframes sheetIn{to{transform:translateY(0);opacity:1}}.dragging-row{position:relative;z-index:60;transform:scale(1.015);background:#242426!important;box-shadow:0 12px 30px rgba(0,0,0,.45)!important;opacity:.96}.drop-target{outline:2px solid rgba(255,255,255,.22);outline-offset:-2px}
.picker-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center}.picker-backdrop.open{display:flex}.time-picker{width:min(520px,100vw);background:#111;border-top:1px solid var(--gold3);padding:10px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px rgba(0,0,0,.6)}.picker-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}.picker-title{color:#f5f5f7;font-weight:800}.picker-done{background:transparent;border:1px solid #3a3a3c;border-radius:0;color:#f5f5f7;padding:7px 14px;font-weight:750}.wheel-wrap{display:grid;grid-template-columns:1fr 1.1fr 1.1fr;gap:5px;position:relative}.wheel-wrap::before{content:"";position:absolute;left:0;right:0;top:50%;height:46px;transform:translateY(-50%);background:rgba(255,255,255,.09);border:1px solid rgba(202,168,74,.42);border-radius:12px;box-shadow:inset 0 0 14px rgba(255,255,255,.035),0 0 10px rgba(202,168,74,.06);pointer-events:none}.wheel{height:184px;overflow-y:auto;scroll-snap-type:y mandatory;scroll-snap-stop:always;scrollbar-width:none;position:relative;z-index:1;overscroll-behavior:contain;touch-action:pan-y}.wheel::-webkit-scrollbar{display:none}.wheel-item{height:46px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;color:#777;font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-size:25px;font-weight:650;user-select:none;-webkit-user-select:none}.wheel-item.selected{color:#fff;font-weight:800;text-shadow:0 0 10px rgba(255,255,255,.12)}.wheel-spacer{height:69px;flex:0 0 69px}
.notice{font-size:12px;color:var(--muted);margin-top:8px}.undo-toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:none;align-items:center;gap:12px;max-width:calc(100vw - 28px);padding:10px 12px 10px 14px;background:#151515;border:1px solid rgba(202,168,74,.55);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.55);color:var(--text);font-size:14px}.undo-toast.open{display:flex}.undo-toast button{border:0;background:transparent;color:#f5f5f7;font-weight:800;padding:6px 2px}
.day-picker{position:fixed;left:12px;top:calc(58px + env(safe-area-inset-top));z-index:40;width:min(210px,calc(100vw - 24px));background:#101010;border:1px solid #3a3a3c;border-radius:16px;padding:8px;box-shadow:0 14px 35px rgba(0,0,0,.6);display:none;text-align:left}.day-picker.open{display:block}.day-picker button{display:block;width:100%;min-height:42px;margin:3px 0;background:transparent;border:0;border-radius:10px;color:var(--text);font-weight:700;text-align:left;padding:8px 12px}.day-picker button:active,.day-picker button.selected{background:linear-gradient(90deg,rgba(202,168,74,.18),rgba(202,168,74,.05));color:#f5f5f7}.settings{position:fixed;right:calc(15px + env(safe-area-inset-right));bottom:calc(15px + env(safe-area-inset-bottom));z-index:30}
.gear{width:50px;height:50px;border-radius:50%;padding:0;background:#111;border:1px solid var(--gold);color:#f5f5f7;font-size:23px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.settings-menu{position:absolute;right:0;bottom:60px;width:210px;background:#111;border:1px solid #3a3a3c;border-radius:14px;padding:7px;box-shadow:0 12px 30px rgba(0,0,0,.55);display:none;text-align:left}
.settings.open .settings-menu{display:block}
.settings-menu button{display:block;width:100%;min-height:44px;margin:4px 0;text-align:left;background:transparent;border:0;border-radius:9px;color:var(--text);font-weight:650;padding:9px 12px}.settings-menu button:active{background:#1d1d1d}.settings-menu .danger-action{color:#e0aaaa}
@media (orientation:landscape) and (min-width:700px){main{padding:18px 28px 100px}.row{max-width:900px;margin:8px auto}.panel{max-width:900px;margin-left:auto;margin-right:auto}.section-title{margin-top:4px}}
@media(max-width:520px){header{padding-left:14px;padding-right:14px}h1{font-size:25px}.title-mark{width:40px;height:40px}.title-mark img{width:40px;height:40px}.row{gap:6px;padding:8px 7px}.time-side{min-width:70px;font-size:15px}.row>input[type=text]{font-size:15px;min-width:70px;max-width:52vw}.task span{max-width:75%}.task input[type=checkbox]{right:8px}.task-add-row{padding:6px 7px}.task-add-text{font-size:14px;padding:10px 6px}}
</style>
</head>

function updateWheelSelected(node){const idx=wheelIndex(node);node.querySelectorAll('.wheel-item').forEach((item,i)=>item.classList.toggle('selected',i===idx))}
function openTimePicker(value,title,onDone){const [hh,mm]=String(value||"09:00").split(":").map(Number);picker.value=`${pad2(hh)}:${pad2(mm)}`;picker.onDone=onDone;picker.picked={ap:hh>=12?1:0,hour:(hh%12)||12,min:mm};picker.title=title;picker.backdrop.classList.add('open');document.getElementById('pickerTitle').textContent=title;renderWheel(picker.ap,['AM','PM'],picker.picked.ap);renderWheel(picker.hour,Array.from({length:12},(_,i)=>pad2(i+1)),picker.picked.hour-1);renderWheel(picker.min,Array.from({length:60},(_,i)=>pad2(i)),picker.picked.min);}
function closeTimePicker(commit){if(!picker.backdrop.classList.contains('open'))return;if(commit&&picker.onDone){const ap=wheelIndex(picker.ap),h=wheelIndex(picker.hour)+1,m=wheelIndex(picker.min);const hh=ap?(h===12?12:h+12):(h===12?0:h);picker.onDone(`${pad2(hh)}:${pad2(m)}`)}picker.backdrop.classList.remove('open');picker.onDone=null}
function timeSelect(value,onChange){let [start,end]=parseRange(value);const box=el('div','timebox');const a=el('button','time-side',formatTime(start)),sep=el('span','time-sep','～'),b=el('button','time-side',formatTime(end));a.type=b.type='button';const valid=(s,e)=>{if(minutes(e)<=minutes(s)){alert("結束時間必須晚於開始時間。請重新設定。");return false}return true};a.onclick=()=>openTimePicker(start,'設定開始時間',v=>{if(!valid(v,end))return;start=v;a.textContent=formatTime(start);onChange(`${start}–${end}`)});b.onclick=()=>openTimePicker(end,'設定結束時間',v=>{if(!valid(start,v))return;end=v;b.textContent=formatTime(end);onChange(`${start}–${end}`)});box.append(a,sep,b);return box}
picker.backdrop=document.getElementById('pickerBackdrop');picker.ap=document.getElementById('wheelAP');picker.hour=document.getElementById('wheelHour');picker.min=document.getElementById('wheelMin');[picker.ap,picker.hour,picker.min].forEach(node=>{let t=null;node.addEventListener('scroll',()=>{updateWheelSelected(node);clearTimeout(t);t=setTimeout(()=>{const i=wheelIndex(node);node.scrollTo({top:WHEEL_PAD+i*WHEEL_ITEM,behavior:'smooth'});updateWheelSelected(node)},90)},{passive:true})});document.getElementById('pickerDone').onclick=()=>closeTimePicker(true);picker.backdrop.addEventListener('click',e=>{if(e.target===picker.backdrop)closeTimePicker(false)});
function autoGrowTextarea(input){if(!input)return;input.style.height="auto";const max=96;input.style.height=Math.min(Math.max(input.scrollHeight,42),max)+"px"}
function bindAutoSize(input){input.addEventListener("input",()=>autoGrowTextarea(input));requestAnimationFrame(()=>autoGrowTextarea(input))}
function longPress(node,callback){let timer=null,moved=false;let longTriggered=false;const clear=()=>{if(timer){clearTimeout(timer);timer=null}};node.addEventListener("contextmenu",e=>{e.preventDefault();e.stopPropagation()});node.addEventListener("pointerdown",e=>{moved=false;longTriggered=false;clear();timer=setTimeout(()=>{timer=null;if(!moved){longTriggered=true;node.__longPressed=true;callback()}},650)});node.addEventListener("pointermove",e=>{if(Math.abs(e.movementX||0)>8||Math.abs(e.movementY||0)>8){moved=true;clear()}});node.addEventListener("pointerup",e=>{clear();if(longTriggered){e.preventDefault();e.stopPropagation();setTimeout(()=>{node.__longPressed=false},0)}});node.addEventListener("pointercancel",clear);node.addEventListener("pointerleave",()=>{if(!longTriggered)clear()});node.addEventListener("click",e=>{if(node.__longPressed){e.preventDefault();e.stopPropagation();node.__longPressed=false}},true)}
function confirmDelete(message,fn){if(confirm(message))fn()}
let undoTimer=null,undoAction=null;function showUndo(message,fn){const toast=document.getElementById("undoToast");document.getElementById("undoText").textContent=message;undoAction=fn;toast.classList.add("open");clearTimeout(undoTimer);undoTimer=setTimeout(()=>{toast.classList.remove("open");undoAction=null},6500)}
document.getElementById("actionSheetBackdrop").addEventListener("click",e=>{if(e.target.id==="actionSheetBackdrop")e.currentTarget.classList.remove("open")});
document.getElementById("undoBtn").onclick=()=>{if(undoAction){const fn=undoAction;undoAction=null;clearTimeout(undoTimer);document.getElementById("undoToast").classList.remove("open");fn()}}
function minutes(v){const [h,m]=String(v||"00:00").split(":").map(Number);return h*60+m}
function currentMinutes(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function isTodaySelected(){const map=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];return state.selected===map[new Date().getDay()]}
function isActiveRange(v){if(!isTodaySelected())return false;const [a,b]=parseRange(v),now=currentMinutes();let s=minutes(a),e=minutes(b);if(e<=s)e+=1440;return now>=s&&now<e}
function isPastRange(v){if(!isTodaySelected())return false;const [,b]=parseRange(v);return currentMinutes()>=minutes(b)}
function openActionSheet(row,index,items){const bd=document.getElementById("actionSheetBackdrop");bd.classList.add("open");bd.dataset.index=index;bd.__row=row;bd.__items=items;document.getElementById("moveAction").onclick=()=>{bd.classList.remove("open");startRowDrag(row,index,items)};document.getElementById("deleteAction").onclick=()=>{bd.classList.remove("open");confirmDelete("要刪除這個行程嗎？",()=>{const removed=items.splice(index,1)[0];save();render();showUndo("行程已刪除",()=>{items.splice(index,0,removed);save();render()})})};document.getElementById("cancelAction").onclick=()=>bd.classList.remove("open")}
function setupScheduleLongPress(row,index,items){let timer=null,moved=false;row.addEventListener("contextmenu",e=>e.preventDefault());row.addEventListener("pointerdown",e=>{if(e.target.closest("button,textarea,input"))return;moved=false;clearTimeout(timer);timer=setTimeout(()=>{timer=null;if(!moved)openActionSheet(row,index,items)},620)});row.addEventListener("pointermove",e=>{if(Math.abs(e.movementX||0)>7||Math.abs(e.movementY||0)>7){moved=true;clearTimeout(timer)}});row.addEventListener("pointerup",()=>clearTimeout(timer));row.addEventListener("pointercancel",()=>clearTimeout(timer))}
function startRowDrag(row,index,items){row.classList.add("dragging-row");let startY=0,active=true;const move=e=>{if(!active)return;const y=e.clientY;const rows=[...document.querySelectorAll("#schedulePanel .row")];rows.forEach(r=>r.classList.remove("drop-target"));let target=null,best=Infinity;rows.forEach(r=>{if(r===row)return;const rect=r.getBoundingClientRect(),d=Math.abs(y-(rect.top+rect.height/2));if(d<best){best=d;target=r}});if(target)target.classList.add("drop-target")};const up=e=>{if(!active)return;active=false;row.classList.remove("dragging-row");const rows=[...document.querySelectorAll("#schedulePanel .row")];rows.forEach(r=>r.classList.remove("drop-target"));const y=e.clientY;let newIndex=index;let target=null,best=Infinity;rows.forEach(r=>{if(r===row)return;const rect=r.getBoundingClientRect(),d=Math.abs(y-(rect.top+rect.height/2));if(d<best){best=d;target=r}});if(target){const targetIndex=Number(target.dataset.index);newIndex=targetIndex+(y>target.getBoundingClientRect().top+target.getBoundingClientRect().height/2?1:0);if(newIndex>index)newIndex--;newIndex=Math.max(0,Math.min(items.length-1,newIndex));const [movedItem]=items.splice(index,1);items.splice(newIndex,0,movedItem);save();renderSchedule()}document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up)};document.addEventListener("pointermove",move);document.addEventListener("pointerup",up,{once:true})}
function renderSchedule(){const p=document.getElementById("schedulePanel");p.innerHTML="";p.classList.toggle("other-day",!isTodaySelected());p.append(el("div","section-title","行程"));const items=state.schedule[state.selected]||[];const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();const today=isTodaySelected();const visible=items.map((it,i)=>({it,i})).filter(({it})=>!q||String(it[1]||"").toLowerCase().includes(q)||String(it[0]||"").includes(q));if(!visible.length)p.append(el("div","empty",q?"找不到符合的行程。":(today?"今天還沒有行程。":"這天還沒有行程。")));visible.forEach(({it,i})=>{if(!Array.isArray(it))return;const row=el("div","row"),name=document.createElement("textarea");name.rows=1;name.value=it[1]||"";name.placeholder="行程名稱";name.oninput=()=>{it[1]=name.value;save();autoGrowTextarea(name)};name.onchange=()=>{it[1]=name.value;save()};bindAutoSize(name);if(isActiveRange(it[0]))row.classList.add("active-row");if(isPastRange(it[0]))row.classList.add("past-row");if(!today)row.classList.add("other-day");row.dataset.index=i;row.append(timeSelect(it[0],v=>{it[0]=v;save();renderSchedule()}),name);setupScheduleLongPress(row,i,items);p.append(row)});const add=el("button","add-btn","＋新增行程");add.onclick=()=>{items.push(["09:00–10:00","新的行程"]);save();renderSchedule()};p.append(add)}
function normalizeTasks(){for(const d of days){const list=state.tasks[d]||[];state.tasks[d]=list.map(t=>typeof t==="string"?{time:"09:00",text:t,done:false}:{time:t.time||"09:00",text:t.text||"",done:!!t.done})}}
function renderTasks(){const p=document.getElementById("taskPanel");p.innerHTML="";p.classList.toggle("other-day",!isTodaySelected());p.append(el("div","section-title","待辦"));const allTasks=days.flatMap(d=>state.tasks[d]||[]);const doneCount=allTasks.filter(t=>t.done).length;const stats=el("div","task-stats",`全部待辦：${allTasks.length}　已完成：${doneCount}`);p.append(stats);const list=state.tasks[state.selected]||[];const q=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();const filtered=list.map((t,i)=>({t,i})).filter(({t})=>!q||String(t.text||"").toLowerCase().includes(q));const wrap=el("div","task-list");if(!filtered.length)wrap.append(el("div","empty",q?"找不到符合的待辦。":"今天還沒有待辦事項。"));filtered.forEach(({t,i})=>{const row=el("div","task"),c=el("input"),s=el("span");c.type="checkbox";c.checked=t.done;s.textContent=t.text;s.className=t.done?"done":"";c.onchange=()=>{t.done=c.checked;save();renderTasks()};row.append(s,c);longPress(row,()=>confirmDelete("要刪除這個待辦嗎？",()=>{const removed=list.splice(i,1)[0];save();renderTasks();showUndo("待辦已刪除",()=>{list.splice(i,0,removed);state.tasks[state.selected]=list;save();renderTasks()})}));wrap.append(row)});p.append(wrap);const addRow=el("div","task-add-row"),input=el("input","task-add-text");input.type="text";input.placeholder="輸入待辦事項";addRow.append(input);const add=el("button","add-btn","＋新增待辦");add.onclick=()=>{if(input.value.trim()){list.push({time:"09:00",text:input.value.trim(),done:false});state.tasks[state.selected]=list;save();renderTasks()}};p.append(addRow,add)}
function updateDay(){const n={星期一:1,星期二:2,星期三:3,星期四:4,星期五:5,星期六:6,星期日:7}[state.selected]||1;const icon=document.getElementById("dayIcon");icon.src=dayIcons[n];icon.alt=state.selected;renderDayPicker()}
function selectDay(day){state.selected=day;save();document.getElementById("dayPicker").classList.remove("open");render()}
function goToday(){const map=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];selectDay(map[new Date().getDay()])}
function renderDayPicker(){const p=document.getElementById("dayPicker");p.innerHTML="";days.forEach(day=>{const b=el("button",day===state.selected?"selected":"",day);b.type="button";b.onclick=()=>selectDay(day);p.append(b)})}
function render(){normalizeTasks();save();updateDay();renderSchedule();renderTasks()}
let sx=0,sy=0,tracking=false;document.getElementById("main").addEventListener("touchstart",e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true},{passive:true});document.getElementById("main").addEventListener("touchend",e=>{if(!tracking)return;tracking=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.25){let i=days.indexOf(state.selected);i=(i+(dx<0?1:-1)+days.length)%days.length;state.selected=days[i];save();render()}},{passive:true});
const dayMark=document.getElementById("dayMark"),dayPicker=document.getElementById("dayPicker");let dayLongTimer=null,dayMoved=false,dayLongTriggered=false;dayMark.addEventListener("pointerdown",e=>{e.preventDefault();dayMoved=false;dayLongTriggered=false;if(dayLongTimer)clearTimeout(dayLongTimer);dayLongTimer=setTimeout(()=>{dayLongTimer=null;if(!dayMoved){dayLongTriggered=true;renderDayPicker();dayPicker.classList.add("open")}},650)});dayMark.addEventListener("pointermove",e=>{if(Math.abs(e.movementX||0)>8||Math.abs(e.movementY||0)>8)dayMoved=true;if(dayMoved&&dayLongTimer){clearTimeout(dayLongTimer);dayLongTimer=null}});dayMark.addEventListener("pointerup",e=>{if(dayLongTimer){clearTimeout(dayLongTimer);dayLongTimer=null}if(!dayMoved&&!dayLongTriggered){goToday()}dayLongTriggered=false});dayMark.addEventListener("pointercancel",()=>{if(dayLongTimer){clearTimeout(dayLongTimer);dayLongTimer=null}dayLongTriggered=false});dayMark.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("click",e=>{if(!dayPicker.contains(e.target)&&e.target!==dayMark)dayPicker.classList.remove("open")});
const settings=document.getElementById("settings"),gear=document.getElementById("gear");gear.onclick=e=>{e.stopPropagation();settings.classList.toggle("open")};document.addEventListener("click",e=>{if(!settings.contains(e.target)&&e.target!==gear)settings.classList.remove("open")});
const sizeControl=document.getElementById("textSize"),sizeValue=document.getElementById("sizeValue");const savedSize=Number(localStorage.getItem("weeklyPlannerTextSize")||100);sizeControl.value=Math.min(120,Math.max(85,savedSize));document.documentElement.style.setProperty("--text-scale",sizeControl.value/100);sizeValue.textContent=sizeControl.value+"%";sizeControl.oninput=()=>{document.documentElement.style.setProperty("--text-scale",sizeControl.value/100);sizeValue.textContent=sizeControl.value+"%";localStorage.setItem("weeklyPlannerTextSize",sizeControl.value)};
const searchInput=document.getElementById("searchInput"),searchBar=document.getElementById("searchBar"),searchClear=document.getElementById("searchClear");searchInput.addEventListener("input",()=>{searchBar.classList.toggle("search-active",!!searchInput.value);renderSchedule();renderTasks()});searchClear.onclick=()=>{searchInput.value="";searchBar.classList.remove("search-active");renderSchedule();renderTasks();searchInput.focus()};
document.getElementById("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="每週規劃資料.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();document.getElementById("fileInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.schedule&&d.tasks){state=d;state.selected=state.selected||"星期一";save();render();alert("資料匯入完成")}else alert("檔案格式不正確")}catch{alert("無法讀取資料檔")}};r.readAsText(f)};
document.getElementById("resetBtn").onclick=()=>{if(confirm("恢復固定課表？目前自訂行程與待辦會被清除。")){state={schedule:structuredClone(base),tasks:{},selected:"星期一"};save();render();settings.classList.remove("open")}};
